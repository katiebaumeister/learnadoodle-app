<!--
  Supabase "Confirm signup" email template.
  Copy this entire file into: Supabase Dashboard → Authentication → Emails → Templates → Confirm signup.
  Keep {{ .ConfirmationURL }} exactly as-is.
  Yahoo Mail on iPhone does not open a styled inline-block button, so the link is a plain underlined anchor inside a table.
-->
<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:32px 20px; font-family:Arial, Helvetica, sans-serif; color:#172033;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" style="font-size:32px; line-height:40px; font-weight:bold; padding-bottom:28px;">Learnadoodle</td>
          </tr>
          <tr>
            <td style="font-size:22px; line-height:28px; font-weight:bold; padding-bottom:16px;">Welcome to Learnadoodle!</td>
          </tr>
          <tr>
            <td style="font-size:16px; line-height:24px; padding-bottom:8px;">Hello,</td>
          </tr>
          <tr>
            <td style="font-size:16px; line-height:24px; padding-bottom:20px;">Thank you for signing up! Please confirm your email address to get started:</td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 0 24px;">
              <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#208AEF; font-size:18px; line-height:24px; font-weight:bold; text-decoration:underline;">Confirm Email</a>
            </td>
          </tr>
          <tr>
            <td style="font-size:14px; line-height:22px; color:#687186; padding-bottom:28px;">If the button does not open, copy this link into your phone's browser:<br><a href="{{ .ConfirmationURL }}" target="_blank" style="color:#208AEF; word-break:break-all;">{{ .ConfirmationURL }}</a></td>
          </tr>
          <tr>
            <td style="font-size:16px; line-height:24px; color:#687186;">Best regards,<br>The Learnadoodle Team</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
