<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 380px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    
    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
    }
    
    .url-display {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #6b7280;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      color: #111827;
    }
    
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .checkbox-group label {
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      margin: 0;
    }
    
    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .button-primary {
      background: #3b82f6;
      color: white;
    }
    
    .button-primary:hover {
      background: #2563eb;
    }
    
    .button-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .button-secondary {
      background: #f3f4f6;
      color: #374151;
      margin-top: 8px;
    }
    
    .button-secondary:hover {
      background: #e5e7eb;
    }
    
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
    
    .status-success {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status-error {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .status-info {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .auth-prompt {
      text-align: center;
      padding: 40px 20px;
    }
    
    .auth-prompt p {
      color: #6b7280;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    .auth-button {
      background: #3b82f6;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Hi World</h1>
    <p>Capture Learning Resources</p>
  </div>
  
  <div class="content" id="mainContent">
    <div class="url-display" id="urlDisplay">Loading...</div>
    
    <div class="form-group">
      <label for="childSelect">Select Student</label>
      <select id="childSelect">
        <option value="">Loading...</option>
      </select>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="markCompleted">
      <label for="markCompleted">Mark as completed immediately</label>
    </div>
    
    <button class="button button-primary" id="addButton" disabled>
      Add to Planner
    </button>
    
    <button class="button button-secondary" id="loginButton" style="display: none;">
      Sign In to Hi World
    </button>
    
    <div id="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
